main = "worker.mjs"
name = "safaqat-api-testing"
compatibility_date = "2026-11-25"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "safaqat-testing"
database_id = "cdfd5576-8f33-4b6b-b924-720c9ec7d073"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "safaqat-private-testing"

[vars]
DELIVERY_ENABLED = "false"
WHATSAPP_WEBHOOK_ENABLED = "false"
PENDING_REGISTRATION_ENABLED = "false"
ACCOUNTS_ENABLED = "false"
APP_ORIGIN = "https://testing.safaqat.invalid"
